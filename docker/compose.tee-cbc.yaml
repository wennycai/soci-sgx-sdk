# TEE+CBC Gramine-direct regression, decoupled from the core SIM CI.
# Run explicitly with:
#   docker compose -f docker/compose.tee-cbc.yaml up --build \
#     --abort-on-container-exit --exit-code-from tee_cbc_direct
# The default SIM CI (docker/compose.sim.yaml) never builds or runs this.
services:
  tee_cbc_direct:
    build: {context: .., dockerfile: tee_cbc/Dockerfile}
    environment:
      CBC_BIN: /usr/bin/cbc
    security_opt:
      - seccomp=unconfined
    command: ["bash","-lc","scripts/test_tee_cbc_direct.sh"]

  # Native vs Gramine-direct performance acceptance.  Behind a profile so the
  # plain `up` above still runs only the functional regression.  Gramine-direct
  # is a FUNCTIONAL SIMULATION: results are labelled
  # "Gramine-direct / SIM-functional" and are not SGX HW performance.
  # Use `run`, not `up`: `up` also starts tee_cbc_direct, and
  # --abort-on-container-exit stops every container as soon as ANY of them
  # exits, so the much shorter regression tears the benchmark down mid-matrix
  # (observed: SIGKILL, exit 137, after 3 of 12 groups).
  #   docker compose -f docker/compose.tee-cbc.yaml --profile benchmark run \
  #     --rm --build tee_cbc_benchmark
  tee_cbc_benchmark:
    profiles: ["benchmark"]
    build: {context: .., dockerfile: tee_cbc/Dockerfile}
    environment:
      CBC_BIN: /usr/bin/cbc
      TEE_CBC_RESULTS: /results/tee-cbc-benchmark-gramine-direct.json
    security_opt:
      - seccomp=unconfined
    volumes:
      - ../results:/results
    command: ["bash","-lc","scripts/run_tee_cbc_benchmark.sh"]
